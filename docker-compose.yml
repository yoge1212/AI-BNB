services:
  frontend:
    build:
      context: ./hackprinceton
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-public-anon-key}
      PORT: 3000
    volumes:
      - ./hackprinceton:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend

  backend:
    build:
      context: ./hackprinceton/backend
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      # Prefer ANON if provided, otherwise fall back to PUBLISHABLE
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}}
      DEDALUS_API_KEY: ${DEDALUS_API_KEY}
    volumes:
      - ./hackprinceton/backend:/app
    command: flask run --host=0.0.0.0 --port=5001
